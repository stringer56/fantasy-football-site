schema_version: 1

submission_architecture:
  provider: google_forms
  response_store: private_google_sheet
  public_import_format: sanitized_csv_or_json
  duplicate_policy: latest_valid_submission_before_deadline
  voter_identity_field: owner_id
  public_identity: approved_manager_display_name_or_aggregate
  notes:
    - Google Form and Sheet edit URLs must never be committed.
    - Email collection is disabled; controlled owner choices are mapped to canonical owner IDs during sanitization.
    - Raw response exports stay outside the repository in private-vote-imports/.

poll_types:
  - league_rule
  - draft_date
  - scoring_change
  - award
  - hall_of_fame
  - rivalry_name
  - commissioner_proposal
  - custom

poll_schema:
  required_fields: [vote_id, season, title, description, type, status, open_date, close_date, options, results_visibility, anonymous_or_named, form_url, embed_url, result_summary, results_source, notes]
  valid_statuses: [upcoming, open, closed]
  valid_results_visibility: [hidden, after_close, public]
  valid_identity_modes: [anonymous, named]
  option_fields: [id, label, description]

power_ranking_schema:
  ballot_fields: [owner_id, submitted_at, rankings]
  ranking_method: descending_points
  scoring_rule: "For N active teams, rank 1 receives N points and rank N receives 1 point."
  tie_breakers: [total_points, first_place_votes, average_rank]
  unresolved_tie_policy: shared_competition_rank
  public_fields: [rank, movement, franchise_id, total_points, average_rank, first_place_votes, ballots_counted]

matchup_pick_schema:
  ballot_fields: [owner_id, submitted_at, picks]
  pick_fields: [matchup_id, franchise_id]
  scoring: {correct: 1, incorrect: 0, confidence_points: false}
  leaderboard_sort: [correct, accuracy, display_name]
  weekly_result_fields: [season, week, matchups, manager_results]
  lock_policy: single_commissioner_defined_weekly_deadline
  default_results_visibility: after_lock
  default_manager_picks_visibility: private

polls: []
