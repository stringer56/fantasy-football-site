name: Update Yahoo Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yahoo-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate normalizers
        run: python -m unittest discover -s tests -v

      - name: Run sanitized historical discovery probe
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          LEAGUE_KEY: ${{ secrets.LEAGUE_KEY }}
        run: >-
          python scripts/discover_yahoo_history.py
          --output "${{ runner.temp }}/yahoo-history-live-discovery.json"

      - name: Validate and retain sanitized discovery report
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # The live probe validates its sanitized output before writing it.
          # Its diagnostic timestamp must not replace the reproducible baseline.
          python scripts/validate_public_data.py
          python scripts/discover_yahoo_history.py --dry-run --check

      - name: Upload sanitized discovery report
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-history-live-discovery
          path: ${{ runner.temp }}/yahoo-history-live-discovery.json
          if-no-files-found: error
          retention-days: 3

      - name: Pull Yahoo data
        id: yahoo_api
        continue-on-error: true
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          LEAGUE_KEY: ${{ secrets.LEAGUE_KEY }}
        run: python scripts/pull_yahoo.py

      - name: Use official Yahoo page fallback
        id: yahoo_public
        if: ${{ steps.yahoo_api.outcome == 'failure' }}
        continue-on-error: true
        run: python scripts/yahoo_live.py

      - name: Pull news feeds
        run: python scripts/pull_news.py

      - name: Rebuild historical records
        run: python scripts/build_records.py

      - name: Build fresh 2026 live hub data
        if: ${{ steps.yahoo_api.outcome == 'success' || steps.yahoo_public.outcome == 'success' }}
        run: python scripts/refresh_community.py

      - name: Preserve last valid live snapshot as stale
        if: ${{ steps.yahoo_api.outcome == 'failure' && steps.yahoo_public.outcome == 'failure' }}
        run: python scripts/build_live_season.py --stale

      - name: Synchronize verified weekly routes
        run: python scripts/sync_live_week_pages.py

      - name: Validate public generated data
        run: |
          python scripts/validate_public_data.py
          python scripts/validate_site_config.py
          python scripts/validate_live_season.py
          python scripts/validate_votes_data.py
          python scripts/validate_recaps.py
          python scripts/validate_privacy.py

      - name: Commit and push changed public data
        shell: bash
        run: |
          # Empty community archives intentionally do not exist before first publication.
          for path in _data/generated _live_weeks _data/news.json; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No public data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update Yahoo data"
          git push
