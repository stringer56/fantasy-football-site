name: Discover Yahoo History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yahoo-history-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate discovery code offline
        run: |
          python -m unittest tests.test_yahoo_history_discovery -v
          python scripts/discover_yahoo_history.py --dry-run --check

      - name: Discover and probe historical leagues
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          LEAGUE_KEY: ${{ secrets.LEAGUE_KEY }}
        run: python scripts/discover_yahoo_history.py

      - name: Validate sanitized public output
        run: |
          python scripts/validate_public_data.py
          python scripts/validate_repository.py
          python scripts/validate_franchise_data.py

      - name: Commit sanitized discovery result
        shell: bash
        run: |
          git add _data/generated/history_manifest.json
          if git diff --cached --quiet; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update sanitized Yahoo history discovery"
          git push

