name: Validate Site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check generated records
        run: python scripts/build_records.py --check

      - name: Check generated recaps
        run: python scripts/build_recaps.py --check

      - name: Check generated historical metrics
        run: python scripts/build_historical_metrics.py --check

      - name: Check Yahoo history discovery baseline
        run: python scripts/discover_yahoo_history.py --dry-run --check

      - name: Validate repository data
        run: |
          python scripts/validate_public_data.py
          python scripts/validate_repository.py
          python scripts/validate_franchise_data.py
          python scripts/validate_history_data.py
          python scripts/validate_draft_data.py
          python scripts/validate_records_data.py
          python scripts/validate_votes_data.py
          python scripts/validate_recaps.py
          python scripts/validate_yahoo_history_backfill.py
          python scripts/validate_historical_metrics.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Validate rendered site
        run: python scripts/validate_built_site.py

      - name: Upload rendered site preview
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: _site
          retention-days: 3
