name: Live Yahoo Scores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/live-yahoo-scores.yml"
      - ".github/workflows/update.yml"
      - "scripts/pull_yahoo.py"
      - "scripts/pull_yahoo_scores.py"
      - "scripts/yahoo_client.py"
      - "scripts/yahoo_live.py"
      - "scripts/yahoo_normalize.py"
      - "tests/test_yahoo_client.py"
      - "tests/test_yahoo_scores.py"

permissions:
  contents: write

concurrency:
  group: yahoo-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Yahoo live helpers
        run: python -m unittest tests.test_yahoo_client tests.test_yahoo_scores -v

      - name: Validate browser polling
        run: node --test tests/yahoo_live_client.mjs

      - name: Pull current Yahoo scoreboard
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          LEAGUE_KEY: ${{ secrets.LEAGUE_KEY }}
        run: >-
          python scripts/pull_yahoo_scores.py
          ${{ github.event_name == 'push' && '--stability-runs 3 --stability-delay 2' || '' }}

      - name: Publish changed scores
        shell: bash
        run: |
          git add -- _data/generated/matchups.json _data/generated/live_sync.json
          if git diff --cached --quiet; then
            echo "No Yahoo score changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh live Yahoo scores"
          git push
