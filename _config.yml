title: Road to Glory FFL
description: The official league headquarters for Road to Glory Fantasy Football.
theme: minima
url: "https://stringer56.github.io"
baseurl: "/fantasy-football-site"
lang: en
timezone: America/New_York
exclude:
  - tests
  - vendor
collections:
  franchises:
    output: true
    permalink: /teams/:slug/
  seasons:
    output: true
    permalink: /history/:name/
  drafts:
    output: true
    permalink: /drafts/:name/
  live_weeks:
    output: true
defaults:
  - scope:
      path: ""
      type: franchises
    values:
      layout: franchise
  - scope:
      path: ""
      type: seasons
    values:
      layout: season
  - scope:
      path: ""
      type: drafts
    values:
      layout: draft
  - scope:
      path: ""
      type: live_weeks
    values:
      layout: live_week
