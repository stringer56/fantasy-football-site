<section class="page-hero{% if include.compact %} page-hero--compact{% endif %}">
  <div class="wrap page-hero__inner">
    <div class="page-hero__copy">
      {% if include.eyebrow %}<p class="eyebrow">{{ include.eyebrow }}</p>{% endif %}
      <h1>{{ include.title }}</h1>
      {% if include.description %}<p class="page-hero__description">{{ include.description }}</p>{% endif %}
    </div>
    <div class="page-hero__number" aria-hidden="true"><span>Established</span>{{ site.data.league.founded_season }}</div>
  </div>
</section>
